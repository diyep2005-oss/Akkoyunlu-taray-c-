name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Zip dosyasını aç
        run: |
          unzip -q -o "$(ls *.zip | head -n 1)" -d proje
          ls proje
      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon -p proje
      - uses: actions/upload-artifact@v4
        with:
          name: Gokboru-Browser-APK
          path: proje/app/build/outputs/apk/debug/*.apk
